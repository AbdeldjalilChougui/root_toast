name: root_toast
description: >-
  Toasts drawn in the root Overlay so modal sheets, dialogs and the keyboard
  never hide them. Queue, stack or replace, swipe to dismiss, theming, RTL and
  accessibility.
version: 0.1.0
homepage: https://abdeldjalilchougui.biz/
repository: https://github.com/AbeldjalilChougui/root_toast
issue_tracker: https://github.com/AbeldjalilChougui/root_toast/issues
topics:
  - toast
  - snackbar
  - overlay
  - notification
  - widget

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
